AWSTemplateFormatVersion: '2010-09-09'
Description: blinkr - ECS cluster, task definitions, Fargate services

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  FargateSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  FrontendTargetGroupArn:
    Type: String
  BackendTargetGroupArn:
    Type: String
  BackendImage:
    Type: String
  FrontendImage:
    Type: String
  AwsRegion:
    Type: String
    Default: eu-central-1
  FrontendUrl:
    Type: String
  BackendUrl:
    Type: String
  CognitoUserPoolId:
    Type: String
  CognitoUserPoolClientId:
    Type: String
  RollbarSecretArn:
    Type: String
  HoneycombSecretArn:
    Type: String
  DatabaseUrlSecretArn:
    Type: String
  WorkoutEventsQueueUrl:
    Type: String
  WorkoutEventsQueueArn:
    Type: String
  WorkerScheduleExpression:
    Type: String
    Default: rate(1 minute)
    Description: >
      EventBridge Scheduler expression controlling how often the outbox
      worker task runs (rate(...) or cron(...)).

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: blinkr-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/blinkr-backend
      RetentionInDays: 14

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/blinkr-frontend
      RetentionInDays: 14

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/blinkr-outbox-worker
      RetentionInDays: 14

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: blinkr-ecs-task-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: blinkr-secrets-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AwsRegion}:${AWS::AccountId}:parameter/blinkr/*
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub arn:aws:kms:${AwsRegion}:${AWS::AccountId}:alias/aws/ssm

  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: blinkr-backend-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: blinkr-backend-task-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: "*"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !Ref WorkoutEventsQueueArn

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: blinkr-backend
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt BackendTaskRole.Arn
      ContainerDefinitions:
        - Name: backend-flask
          Image: !Ref BackendImage
          Essential: true
          PortMappings:
            - ContainerPort: 4567
              Protocol: tcp
          Environment:
            - Name: FRONTEND_URL
              Value: !Ref FrontendUrl
            - Name: BACKEND_URL
              Value: !Ref BackendUrl
            - Name: OTEL_SERVICE_NAME
              Value: blinkr_backend
            - Name: OTEL_EXPORTER_OTLP_ENDPOINT
              Value: https://api.honeycomb.io
            - Name: AWS_XRAY_DAEMON_ADDRESS
              Value: 127.0.0.1:2000
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AwsRegion
            - Name: AWS_COGNITO_USER_POOL_ID
              Value: !Ref CognitoUserPoolId
            - Name: AWS_COGNITO_USER_POOL_CLIENT_ID
              Value: !Ref CognitoUserPoolClientId
            - Name: WORKOUT_EVENTS_QUEUE_URL
              Value: !Ref WorkoutEventsQueueUrl
          Secrets:
            - Name: ROLLBAR_ACCESS_TOKEN
              ValueFrom: !Ref RollbarSecretArn
            - Name: OTEL_EXPORTER_OTLP_HEADERS
              ValueFrom: !Ref HoneycombSecretArn
            - Name: DATABASE_URL
              ValueFrom: !Ref DatabaseUrlSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AwsRegion
              awslogs-stream-prefix: backend
        - Name: xray-daemon
          Image: amazon/aws-xray-daemon
          Essential: false
          PortMappings:
            - ContainerPort: 2000
              Protocol: udp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AwsRegion
              awslogs-stream-prefix: xray

  # Standalone one-batch outbox worker, same image as the API, different
  # command. No PortMappings (nothing listens), no ALB target group, no
  # AWS::ECS::Service -- this is run on demand via `aws ecs run-task`, not
  # kept running: the container starts, worker.py processes one batch, and
  # exits. Scheduling that invocation (EventBridge Scheduler or otherwise)
  # is a later step, not this one.
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: blinkr-outbox-worker
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt BackendTaskRole.Arn
      ContainerDefinitions:
        - Name: outbox-worker
          Image: !Ref BackendImage
          Essential: true
          Command:
            - python3
            - worker.py
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AwsRegion
            - Name: WORKOUT_EVENTS_QUEUE_URL
              Value: !Ref WorkoutEventsQueueUrl
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Ref DatabaseUrlSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AwsRegion
              awslogs-stream-prefix: worker

  # Lets EventBridge Scheduler (and only EventBridge Scheduler, and only
  # for this account) invoke ecs:RunTask for the worker task specifically,
  # on the existing cluster, and pass it the two roles its task definition
  # already references. Nothing broader -- this role can't run any other
  # task definition, and BackendTaskRole/TaskExecutionRole themselves are
  # untouched.
  WorkerSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: blinkr-outbox-scheduler-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: blinkr-outbox-scheduler-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: !Ref WorkerTaskDefinition
                Condition:
                  ArnLike:
                    ecs:cluster: !GetAtt Cluster.Arn
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt BackendTaskRole.Arn
                  - !GetAtt TaskExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  # Fires WorkerTaskDefinition on a schedule as a one-shot Fargate RunTask --
  # not a service, nothing kept running. Overlapping firings (a slow task
  # from one tick still in flight when the next tick fires) are safe by
  # construction: OutboxPublisher claims rows with `FOR UPDATE SKIP LOCKED`
  # per event, so two concurrent worker tasks just split the unpublished
  # rows between them rather than double-publishing anything -- no
  # additional distributed lock is needed here.
  WorkerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: blinkr-outbox-worker-schedule
      Description: Runs the outbox worker as a one-shot Fargate task to publish unpublished outbox_events.
      ScheduleExpression: !Ref WorkerScheduleExpression
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt WorkerSchedulerRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref WorkerTaskDefinition
          LaunchType: FARGATE
          TaskCount: 1
          NetworkConfiguration:
            AwsvpcConfiguration:
              Subnets: !Ref SubnetIds
              SecurityGroups:
                - !Ref FargateSecurityGroupId
              AssignPublicIp: ENABLED

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: blinkr-frontend
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: frontend-react-js
          Image: !Ref FrontendImage
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AwsRegion
              awslogs-stream-prefix: frontend

  BackendServiceV2:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: blinkr-backend-v2
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref FargateSecurityGroupId
      LoadBalancers:
        - ContainerName: backend-flask
          ContainerPort: 4567
          TargetGroupArn: !Ref BackendTargetGroupArn
      HealthCheckGracePeriodSeconds: 60

  FrontendServiceV2:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: blinkr-frontend-v2
      Cluster: !Ref Cluster
      TaskDefinition: !Ref FrontendTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref FargateSecurityGroupId
      LoadBalancers:
        - ContainerName: frontend-react-js
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroupArn
      HealthCheckGracePeriodSeconds: 60

Outputs:
  ClusterName:
    Value: !Ref Cluster
  BackendServiceName:
    Value: !GetAtt BackendServiceV2.Name
  FrontendServiceName:
    Value: !GetAtt FrontendServiceV2.Name
  WorkerTaskDefinitionArn:
    Value: !Ref WorkerTaskDefinition
