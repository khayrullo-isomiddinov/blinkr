AWSTemplateFormatVersion: '2010-09-09'
Description: blinkr - ALB, security groups, target groups (reuses existing default VPC)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  RouteTableIds:
    Type: List<String>
    Description: >
      Route table(s) associated with SubnetIds, for the DynamoDB gateway
      endpoint's route. Not owned by this stack (this is the default VPC's
      own route table), so supplied externally, same as VpcId/SubnetIds.
  CertificateArn:
    Type: String
    Default: ''
    Description: >
      ACM certificate ARN for blinkr.fit (eu-central-1). Leave blank until the
      certificate is ISSUED -- HTTPS listeners are only created once this is set.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: blinkr ALB - allow inbound HTTP/HTTPS from internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: blinkr-alb-sg

  FargateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: blinkr Fargate tasks - allow inbound only from ALB
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: blinkr-fargate-sg

  FargateIngressFromAlbFrontend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FargateSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  FargateIngressFromAlbBackend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref FargateSecurityGroup
      IpProtocol: tcp
      FromPort: 4567
      ToPort: 4567
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  RdsIngressFromFargate:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref FargateSecurityGroup

  # VPC endpoints so VPC-attached workloads (the workout-analytics Lambda,
  # and reusable by any future one on FargateSecurityGroup) can reach
  # DynamoDB/SSM/KMS without a NAT Gateway, which this account
  # intentionally doesn't have. ECS tasks don't need these -- they reach
  # AWS APIs via their public IP (AssignPublicIp: ENABLED) -- this is only
  # for workloads that can't get a public IP, i.e. Lambda.

  # Gateway endpoint: no ENI, no hourly charge, no security group -- it
  # works by adding a route for DynamoDB's prefix list to the given route
  # tables. Free, so no reason to scope it narrower than "the route tables
  # the relevant subnets use".
  DynamoDbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      RouteTableIds: !Ref RouteTableIds

  # Interface endpoints (SSM, KMS) are ENIs in the given subnets and do
  # need a security group -- HTTPS only, only from the shared Fargate
  # security group the Lambda already reuses (req 8: no new Lambda-
  # specific security group). PrivateDnsEnabled means the *standard*
  # ssm./kms.<region>.amazonaws.com hostnames boto3 already calls resolve
  # privately inside the VPC -- no application/handler code change needed.
  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: blinkr VPC interface endpoints (SSM, KMS) - HTTPS from the shared Fargate/Lambda security group only
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: blinkr-vpc-endpoints-sg

  VpcEndpointIngressFromFargate:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VpcEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref FargateSecurityGroup

  SsmInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true

  KmsInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.kms
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: blinkr-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets: !Ref SubnetIds

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: blinkr-frontend-tg
      Port: 80
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: blinkr-backend-tg
      Port: 4567
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref FrontendTargetGroup

  FrontendTargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: blinkr-frontend-tg-green
      Port: 80
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  BackendTargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: blinkr-backend-tg-green
      Port: 4567
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # own listener since CodeDeploy blue/green swaps a whole listener, not a path rule
  BackendListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '8443'
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref BackendTargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  BackendHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 8443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

Outputs:
  AlbDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  AlbArn:
    Value: !Ref ApplicationLoadBalancer
  FrontendTargetGroupArn:
    Value: !Ref FrontendTargetGroup
  BackendTargetGroupArn:
    Value: !Ref BackendTargetGroup
  FrontendTargetGroupGreenArn:
    Value: !Ref FrontendTargetGroupGreen
  BackendTargetGroupGreenArn:
    Value: !Ref BackendTargetGroupGreen
  FrontendTargetGroupName:
    Value: !GetAtt FrontendTargetGroup.TargetGroupName
  BackendTargetGroupName:
    Value: !GetAtt BackendTargetGroup.TargetGroupName
  FrontendTargetGroupGreenName:
    Value: !GetAtt FrontendTargetGroupGreen.TargetGroupName
  BackendTargetGroupGreenName:
    Value: !GetAtt BackendTargetGroupGreen.TargetGroupName
  FargateSecurityGroupId:
    Value: !Ref FargateSecurityGroup
  VpcEndpointSecurityGroupId:
    Value: !Ref VpcEndpointSecurityGroup
  DynamoDbGatewayEndpointId:
    Value: !Ref DynamoDbGatewayEndpoint
  SsmInterfaceEndpointId:
    Value: !Ref SsmInterfaceEndpoint
  KmsInterfaceEndpointId:
    Value: !Ref KmsInterfaceEndpoint
  HttpListenerArn:
    Value: !Ref HttpListener
  BackendListenerArn:
    Value: !Ref BackendListener
