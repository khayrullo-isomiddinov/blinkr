openapi: '3.0.2'
info:
  title: Backend API
  version: '0.1'

servers:
  - url: https://api.server.test/v1

paths:
  /health:
    get:
      description: 'Load-balancer / container health check'
      tags:
        - health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
